name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: |
          VERSION="1.0.$((GITHUB_RUN_NUMBER - 1))"
          mvn versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn package
